<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1180" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Ombre douce pour les cartes -->
    <filter id="card-shadow" x="-6%" y="-4%" width="112%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Marqueurs de flèches -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#047857" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- En-tête -->
  <rect x="40" y="24" width="840" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="460" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Phase 8 : Active-Learning Production MD Architecture</text>
  <text x="460" y="68" text-anchor="middle" font-size="12" fill="#64748b">Couplage hybride MACE / GPAW Born-Oppenheimer à la volée (T = 300 K)</text>

  <!-- 1. Start Step -->
  <g transform="translate(340, 105)">
    <rect width="240" height="42" rx="21" fill="#0f172a" />
    <text x="120" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Pas de temps : t = n × Δt</text>
  </g>

  <!-- Flèche Start -> MACE -->
  <path d="M 460 147 L 460 180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 2. MACE Prediction -->
  <g transform="translate(260, 182)">
    <rect width="400" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="200" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Prédiction MACE (MLIP Fine-Tuné)</text>
    <text x="200" y="48" text-anchor="middle" font-size="12" fill="#1e40af">Évaluation rapide : E_MACE et tenseur de forces {F_i, MACE}</text>
  </g>

  <!-- Flèche MACE -> Tripwire -->
  <path d="M 460 248 L 460 286" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 3. Tripwire Decision Diamond -->
  <g transform="translate(460, 345)">
    <path d="M 0 -55 L 175 0 L 0 55 L -175 0 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#card-shadow)" />
    <text x="0" y="-12" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Test du Tripwire d'Incertitude</text>
    <text x="0" y="8" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">max_i ||F_i, MACE|| > 4.5 eV/Å ?</text>
    <text x="0" y="26" text-anchor="middle" font-size="10" fill="#78350f">Vérification de la limite de confiance</text>
  </g>

  <!-- BRANCHE GAUCHE : NON (Fast Path) -->
  <path d="M 285 345 L 140 345 L 140 760 L 320 760" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <!-- Label NON -->
  <rect x="155" y="325" width="105" height="22" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="207" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">NON (Stable)</text>
  <text x="130" y="550" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46" transform="rotate(-90 130 550)">Rétention : F_retenu = F_MACE</text>

  <!-- BRANCHE DROITE : OUI (DFT Fallback) -->
  <path d="M 635 345 L 700 345 L 700 420" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-amber)" />
  <!-- Label OUI -->
  <rect x="642" y="325" width="135" height="22" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1" />
  <text x="709" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">OUI (Incertitude élevée)</text>

  <!-- 4. Boîtes DFT Fallback -->
  <!-- Étape 4.1 : Freeze structure -->
  <g transform="translate(520, 422)">
    <rect width="360" height="54" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="180" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Active Learning Alert</text>
    <text x="180" y="40" text-anchor="middle" font-size="11" fill="#7f1d1d">Gel de la géométrie instantanée au pas n</text>
  </g>

  <path d="M 700 476 L 700 502" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- Étape 4.2 : GPAW SCF -->
  <g transform="translate(520, 504)">
    <rect width="360" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="180" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Calcul Single-Point GPAW (DFT)</text>
    <text x="180" y="42" text-anchor="middle" font-size="11" fill="#7c2d12">Résolution auto-cohérente (SCF) Kohn-Sham</text>
    <text x="180" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#c2410c">Gradients Hellmann-Feynman → E_DFT, F_DFT</text>
  </g>

  <path d="M 700 574 L 700 600" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- Étape 4.3 : catalysis.db -->
  <g transform="translate(520, 602)">
    <rect width="360" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="180" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Enregistrement catalysis.db</text>
    <text x="180" y="40" text-anchor="middle" font-size="11" fill="#475569">Archivage pour réentraînement futur (Génération 2)</text>
  </g>

  <path d="M 700 654 L 700 678" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- Étape 4.4 : Override force -->
  <g transform="translate(520, 680)">
    <rect width="360" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="180" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Substitution des Forces</text>
    <text x="180" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">F_retenu = F_DFT (Correction de trajectoire)</text>
  </g>

  <!-- Raccordement branche droite vers Intégrateur -->
  <path d="M 700 728 L 700 760 L 600 760" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-amber)" />

  <!-- 5. Intégrateur Langevin -->
  <g transform="translate(230, 725)">
    <rect width="370" height="74" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#card-shadow)" />
    <text x="185" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Intégrateur Dynamique (Langevin)</text>
    <text x="185" y="44" text-anchor="middle" font-size="11" fill="#334155">Accélération : a_i = F_i / m_i  |  Thermostat (300 K)</text>
    <text x="185" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Mise à jour : r(t + Δt) et v(t + Δt)</text>
  </g>

  <!-- Flèche Intégrateur -> Traj -->
  <path d="M 415 799 L 415 828" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 6. Écriture Trajectoire -->
  <g transform="translate(275, 830)">
    <rect width="280" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="140" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Écriture de la frame dans trajectory.traj</text>
  </g>

  <!-- Flèche Traj -> Compteur -->
  <path d="M 415 872 L 415 900" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 7. Compteur de pas (Losange) -->
  <g transform="translate(415, 942)">
    <path d="M 0 -40 L 130 0 L 0 40 L -130 0 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="0" y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">n == N_total ?</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" fill="#64748b">(ex. 500 ou 5000 pas)</text>
  </g>

  <!-- Boucle NON (Incrémentation) -->
  <path d="M 285 942 L 70 942 L 70 126 L 330 126" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-slate)" />
  <rect x="140" y="924" width="110" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="195" y="938" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">NON : n = n + 1</text>

  <!-- Branche OUI (Fin Phase 8 -> Phase 9) -->
  <path d="M 415 982 L 415 1022" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <rect x="425" y="990" width="45" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="447" y="1004" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">OUI</text>

  <!-- 8. Phase 9 : Post-Traitement -->
  <g transform="translate(230, 1025)">
    <rect width="370" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#card-shadow)" />
    <text x="185" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Phase 9 : Post-Traitement &amp; Observables</text>
    <text x="185" y="46" text-anchor="middle" font-size="11" fill="#166534">• Déplacement quadratique moyen : MSD(t)</text>
    <text x="185" y="64" text-anchor="middle" font-size="11" fill="#166534">• Hauteur d'ancrage du platine : z_Pt(t)</text>
    <text x="185" y="82" text-anchor="middle" font-size="11" fill="#166534">• Fonction de distribution radiale : g(r)</text>
  </g>
</svg>
